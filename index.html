<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0A0A0B">
<title>Navigator from Shokha · Tax Code KZ 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script async src="https://telegram.org/js/telegram-web-app.js" onload="window.__tgLoaded && window.__tgLoaded()"></script>
<style>
:root{--bg:#0A0A0B;--s1:#131315;--s2:#1A1A1D;--line:#24221E;--line2:#2F2C27;--text:#F5F1E8;--muted:#A39E92;--muted2:#8A857A;--gold:#C9A96E;--gold2:#E3C892;--goldbg:rgba(201,169,110,.10);--goldln:rgba(201,169,110,.38);--ink:#0A0A0B}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg)}
body{font-family:Onest,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tn{font-variant-numeric:tabular-nums}
/* top bar */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px 18px;background:rgba(10,10,11,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{flex:1;min-width:0;display:flex;align-items:center;gap:11px}
.mono{width:34px;height:34px;flex:none;border:1px solid var(--gold);border-radius:9px;display:grid;place-items:center;font-weight:700;font-size:17px;color:var(--gold)}
.brand b{display:block;font-weight:700;font-size:16px;line-height:1;letter-spacing:-.02em}
.brand small{display:block;margin-top:5px;font-size:9.5px;font-weight:600;line-height:1;letter-spacing:.2em;color:var(--gold)}
.back{width:36px;height:36px;flex:none;border-radius:10px;border:1px solid var(--line2);background:transparent;display:none;place-items:center;cursor:pointer;color:var(--text)}
.back.show{display:grid}
.ttl{flex:1;min-width:0}
.ttl b{display:block;font-weight:700;font-size:16px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl small{display:block;margin-top:2px;font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lang{display:flex;flex:none;border:1px solid var(--line2);border-radius:999px;padding:3px}
.lang button{border:0;background:transparent;color:var(--muted);font-weight:600;font-size:11px;letter-spacing:.08em;padding:6px 11px;border-radius:999px;cursor:pointer}
.lang button.on{background:var(--gold);color:var(--ink)}
main{max-width:720px;margin:0 auto;padding:22px 20px 112px}
/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);padding:9px 6px calc(9px + env(safe-area-inset-bottom));background:rgba(10,10,11,.96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;font-weight:500;color:var(--muted2);padding:3px 0}
.tabs a .i{width:22px;height:22px}
.tabs a.on{color:var(--gold);font-weight:600}
/* common */
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:30px 0 12px}
.sec h2{margin:0;font-weight:700;font-size:22px;letter-spacing:-.025em}
.sec a,.sec span{font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);white-space:nowrap}
.card{background:var(--s1);border:1px solid var(--line);border-radius:16px}
.pad{padding:4px 16px}
.muted{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:14px}
.foot{font-size:11px;color:var(--muted2);text-align:center;margin:30px 8px 6px;line-height:1.6}
.foot b{color:var(--gold);font-weight:600;letter-spacing:.14em}
/* home */
h1.hero{margin:10px 0 0;font-weight:700;font-size:36px;line-height:1.04;letter-spacing:-.035em}
.lead{margin:12px 0 0;font-size:14px;line-height:1.5;color:var(--muted)}
.sbar{display:flex;align-items:center;gap:12px;height:52px;margin-top:22px;padding:0 16px;border-radius:14px;background:var(--s1);border:1px solid var(--goldln);color:var(--muted2);font-size:14px;cursor:pointer}
.sbar .i{color:var(--gold)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);margin-top:22px;padding:14px 0;border-top:1px solid var(--line2);border-bottom:1px solid var(--line2)}
.kpi{display:flex;flex-direction:column;align-items:center;gap:4px}
.kpi+.kpi{border-left:1px solid var(--line2)}
.kpi b{font-weight:700;font-size:26px;line-height:1;letter-spacing:-.03em;color:var(--gold)}
.kpi i{font-style:normal;font-size:9.5px;font-weight:500;letter-spacing:.14em;color:var(--muted)}
.next{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.next .tx{flex:1;min-width:0}
.next .tx small{display:block;font-size:10.5px;font-weight:600;letter-spacing:.16em;color:var(--gold)}
.next .tx b{display:block;margin-top:3px;font-size:15px;font-weight:600}
.count{flex:none;min-width:58px;padding:8px 10px;border-radius:12px;border:1px solid var(--goldln);text-align:center}
.count b{display:block;font-size:22px;font-weight:700;line-height:1;color:var(--gold)}
.count i{display:block;margin-top:3px;font-style:normal;font-size:10px;color:var(--muted)}
.ev{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid var(--line)}
.ev:first-child{border-top:0}
.ev .ic{color:var(--gold);display:grid;place-items:center}
.ev .nm{flex:1;min-width:0;font-size:14px;font-weight:600;line-height:1.3}
.ev .nm small{display:block;font-size:11.5px;font-weight:500;color:var(--gold);margin-top:2px}
.ev.past .nm,.ev.past .ic{opacity:.45}
.pills{display:flex;gap:5px;flex:none}
.pill{display:inline-flex;align-items:center;justify-content:center;min-width:44px;padding:5px 8px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.02em}
.pill.P{background:var(--gold);color:var(--ink)}
.pill.D{border:1px solid var(--gold);color:var(--gold)}
.pill.C{border:1px solid var(--line2);color:var(--muted)}
.pill.past{opacity:.38}
.pill.today{box-shadow:0 0 0 3px rgba(201,169,110,.28)}
.legend-k{padding:10px 16px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:560px){.grid2{grid-template-columns:repeat(3,1fr)}}
.tile{display:flex;flex-direction:column;gap:6px;min-height:138px;padding:14px;border-radius:16px;background:var(--s1);border:1px solid var(--line);cursor:pointer;transition:border-color .15s,transform .08s}
.tile:active{transform:scale(.985)}
.tile:hover{border-color:var(--goldln)}
.tile .n{display:flex;align-items:flex-start;justify-content:space-between;font-weight:700;font-size:26px;line-height:1;letter-spacing:-.03em;color:var(--gold)}
.tile .n .i{color:var(--muted2);width:19px;height:19px}
.tile .nm{font-size:14px;font-weight:600;line-height:1.25}
.tile .ar{margin-top:auto;font-size:11.5px;color:var(--muted)}
.tile.exam{background:transparent;border-style:dashed;border-color:var(--line2)}
.tile.exam .n{color:var(--muted2)}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tool{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:14px;border-radius:16px;background:var(--s1);border:1px solid var(--line)}
.tool .i{color:var(--gold);width:22px;height:22px}
.tool b{font-size:13px;font-weight:600;line-height:1.2}
/* topic page */
.phero{position:relative;overflow:hidden;padding:20px 18px;border-radius:20px;background:var(--s1);border:1px solid var(--line)}
.phero .big{position:absolute;right:-6px;top:-22px;font-weight:800;font-size:120px;line-height:1;letter-spacing:-.06em;color:rgba(201,169,110,.10);pointer-events:none}
.phero h1{position:relative;margin:8px 0 6px;font-weight:700;font-size:26px;line-height:1.12;letter-spacing:-.03em}
.phero .loc{position:relative;font-size:13px;color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar,.hscroll::-webkit-scrollbar,.mchips::-webkit-scrollbar{display:none}
.chipsrow{position:relative;display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chipsrow span{padding:4px 10px;border-radius:999px;border:1px solid var(--line2);font-size:12px;font-weight:500;color:var(--muted)}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;padding:8px 13px;border-radius:999px;border:1px solid var(--line2);background:transparent;font-size:12.5px;font-weight:600;color:var(--text);cursor:pointer}
.chip .i{width:16px;height:16px;color:var(--gold)}
.chip.on{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.mx{padding:16px;margin-bottom:12px}
.mx h3{display:flex;align-items:center;gap:10px;margin:0 0 6px;font-size:16px;font-weight:700;letter-spacing:-.02em}
.mx h3 .i{color:var(--gold)}
.el{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.el .lb{padding-top:2px;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.el .tx{font-size:13.5px}
.el.rate .tx{font-weight:700;color:var(--gold2)}
.ref{display:inline-block;margin-top:6px;padding:2px 9px;border-radius:999px;border:1px solid var(--goldln);font-size:11.5px;font-weight:600;color:var(--gold);cursor:pointer}
.item{display:flex;gap:12px;padding:13px 0;border-top:1px solid var(--line);cursor:pointer}
.item:first-child{border-top:0}
.badge{flex:none;width:48px;height:48px;border-radius:12px;border:1px solid var(--goldln);display:grid;place-items:center;font-weight:700;font-size:14px;letter-spacing:-.02em;color:var(--gold);font-variant-numeric:tabular-nums}
.item .bd{flex:1;min-width:0}
.item .t1{font-size:14px;font-weight:600;line-height:1.3}
.item .t2{margin-top:3px;font-size:12.5px;color:var(--muted)}
.item .pg{flex:none;align-self:center;font-size:11.5px;font-weight:600;color:var(--muted2)}
.tag{display:inline-block;margin-bottom:4px;font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
mark{background:rgba(201,169,110,.32);color:inherit;border-radius:3px;padding:0 1px}
/* search */
.search{position:sticky;top:59px;z-index:5;margin:0 -20px;padding:0 20px 12px;background:var(--bg)}
.search label{display:flex;align-items:center;gap:12px;height:54px;padding:0 16px;border-radius:14px;background:var(--s1);border:1px solid var(--goldln)}
.search label .i{color:var(--gold)}
.search input{flex:1;min-width:0;border:0;outline:none;background:transparent;font-size:16px;color:var(--text)}
.search input::placeholder{color:var(--muted2)}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
.count2{margin:4px 2px 10px;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted2)}
.gl{padding:13px 0;border-top:1px solid var(--line)}
.gl:first-child{border-top:0}
.gl b{font-size:14.5px;font-weight:600}
.gl div{margin-top:3px;font-size:13px;color:var(--muted)}
/* sheet */
.ov{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.6);animation:fade .15s}
.panel{width:100%;max-width:720px;max-height:86vh;overflow:auto;padding:10px 20px calc(22px + env(safe-area-inset-bottom));border-radius:24px 24px 0 0;background:var(--s1);border-top:1px solid var(--goldln);animation:up .2s ease-out}
.grab{width:42px;height:4px;margin:4px auto 14px;border-radius:9px;background:var(--line2)}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.panel .an{font-weight:800;font-size:38px;line-height:1;letter-spacing:-.04em;color:var(--gold)}
.panel h3{margin:10px 0 4px;font-size:19px;font-weight:700;line-height:1.25;letter-spacing:-.02em}
.panel .alt{font-size:13px;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:9px 14px;margin:16px 0;font-size:13.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600}
.note{margin:12px 0;padding:12px 14px;border-radius:12px;background:var(--goldbg);border:1px solid var(--goldln);font-size:13.5px}
.tip{display:flex;gap:8px;align-items:flex-start;margin-top:10px;font-size:12.5px;color:var(--muted)}
.tip .i{width:17px;height:17px;color:var(--gold);margin-top:1px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:12px;padding:14px;border:0;border-radius:14px;background:var(--gold);color:var(--ink);font-weight:700;font-size:14.5px;cursor:pointer}
.btn.ghost{background:transparent;border:1px solid var(--line2);color:var(--text)}
/* calculators */
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ccard{display:flex;flex-direction:column;gap:10px;min-height:128px;padding:14px;border-radius:16px;background:var(--s1);border:1px solid var(--line)}
.ccard .ib{width:40px;height:40px;border-radius:11px;border:1px solid var(--goldln);display:grid;place-items:center;color:var(--gold)}
.ccard b{font-size:14px;font-weight:600;line-height:1.25}
.ccard i{margin-top:auto;font-style:normal;font-size:11px;color:var(--muted2)}
.inp{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.inp:first-child{border-top:0}
.inp label{flex:1;font-size:13.5px;color:var(--text)}
.inp input,.inp select{width:46%;max-width:200px;padding:10px 12px;border-radius:12px;border:1px solid var(--line2);background:var(--bg);font-size:16px;font-weight:600;text-align:right;color:var(--gold2);outline:none;font-variant-numeric:tabular-nums}
.inp select{text-align:left;color:var(--text);font-weight:500;font-size:14px}
.inp input:focus,.inp select:focus{border-color:var(--gold)}
input[type=date]{color-scheme:dark}
.res{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:13.5px}
.res:first-child{border-top:0}
.res .v{flex:none;font-weight:700;white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.res small{display:block;margin-top:2px;font-size:11.5px;color:var(--muted)}
.res.big{margin:8px 0;padding:14px;border:1px solid var(--goldln);border-radius:14px;background:var(--goldbg);font-weight:600}
.res.big+.res{border-top:0}
.res.big .v{font-size:19px;color:var(--gold)}
.donut{display:flex;align-items:center;gap:16px;margin-top:8px}
.legend{font-size:12.5px}
.legend div{display:flex;align-items:center;gap:7px;margin:4px 0;color:var(--muted)}
.legend div b{color:var(--text)}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.fill{display:inline-flex;align-items:center;gap:6px;padding:10px 0 4px;border:0;background:transparent;font-size:13px;font-weight:600;color:var(--gold);cursor:pointer}
/* calendar */
.mchips{display:flex;gap:6px;overflow-x:auto;padding:0 0 12px}
.hscroll{overflow-x:auto;border-radius:16px;border:1px solid var(--line);background:var(--s1)}
table.hm{border-collapse:separate;border-spacing:3px;font-size:11px}
table.hm th{padding:7px 4px;border-radius:7px;background:var(--s2);font-size:10px;font-weight:600;letter-spacing:.1em;color:var(--muted)}
table.hm th.cur{background:var(--gold);color:var(--ink)}
table.hm td{width:46px;min-width:46px;height:40px;border-radius:7px;background:var(--bg);text-align:center;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
table.hm td.P{background:var(--gold);color:var(--ink)}
table.hm td.D{background:var(--goldbg);color:var(--gold);box-shadow:inset 0 0 0 1px var(--goldln)}
table.hm td.nm{position:sticky;left:0;z-index:1;min-width:150px;max-width:160px;padding:4px 10px;background:var(--s1);text-align:left;font-size:11.5px;font-weight:600;color:var(--text)}
/* rates */
.settings{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.settings label{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.settings input{width:100%;margin-top:5px;padding:10px;border-radius:12px;border:1px solid var(--line2);background:var(--bg);font-size:16px;font-weight:600;color:var(--gold2);outline:none;font-variant-numeric:tabular-nums}
.settings input:focus{border-color:var(--gold)}
.bandh{display:flex;align-items:center;gap:10px;margin:28px 2px 10px;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.bandh .i{width:18px;height:18px}
.bandh:after{content:"";flex:1;height:1px;background:var(--line2)}
.rrow{padding:12px 0;border-top:1px solid var(--line)}
.rrow:first-child{border-top:0}
.rrow .top2{display:flex;justify-content:space-between;gap:12px}
.rrow .l{font-size:13.5px}
.rrow .val{flex:none;font-weight:700;white-space:nowrap;text-align:right;color:var(--gold);font-variant-numeric:tabular-nums}
.rrow .tg{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.rrow .n{margin-top:3px;font-size:12px;color:var(--muted)}
.rrow .n b{color:var(--gold);font-weight:600}
.bar{height:3px;margin-top:8px;border-radius:3px;background:var(--line2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--gold)}
/* deadlines, map */
.dl{padding:14px 0;border-top:1px solid var(--line)}
.dl:first-child{border-top:0}
.dl .h{display:flex;align-items:center;gap:9px;font-size:14.5px;font-weight:600}
.dl .h .i{color:var(--gold)}
.dl .per{margin-left:auto;padding:3px 9px;border-radius:999px;border:1px solid var(--line2);font-size:10.5px;font-weight:600;letter-spacing:.06em;color:var(--muted)}
.dl .r2{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;margin-top:8px;font-size:12.5px}
.dl .r2 b{padding-top:1px;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted2)}
.dl .r2 .py{font-weight:600;color:var(--gold2)}
.kd{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-size:13px}
.kd:first-child{border-top:0}
.kd .d{flex:0 0 96px;height:fit-content;padding:5px 9px;border-radius:9px;border:1px solid var(--goldln);font-size:12px;font-weight:700;color:var(--gold)}
details.sct{margin-bottom:8px;border-radius:16px;background:var(--s1);border:1px solid var(--line);overflow:hidden}
details.sct summary{display:flex;align-items:center;gap:10px;padding:14px;list-style:none;font-size:13.5px;font-weight:600;cursor:pointer}
details.sct summary::-webkit-details-marker{display:none}
details.sct summary .sn{flex:none;padding:3px 8px;border-radius:7px;border:1px solid var(--goldln);font-size:11px;font-weight:700;color:var(--gold)}
details.sct[open] summary{border-bottom:1px solid var(--line)}
.chr{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--line);font-size:13px;cursor:pointer}
.chr:first-of-type{border-top:0}
.chr .cn{min-width:46px;font-size:11.5px;font-weight:600;color:var(--muted2)}
.chr .x{flex:1;display:flex;align-items:center;gap:8px}
.chr .x .i{width:16px;height:16px;color:var(--gold)}
.chr .ar2{flex:none;font-size:11.5px;color:var(--muted2);white-space:nowrap}
</style>
</head>
<body>
<header class="top">

 cit:{icon:'💼',code:'W12',title:['Corporate income tax','КПН за год'],arts:['Art. 236, 339, 345, 348, 357','Ст. 236, 339, 345, 348, 357'],
  inputs:[{k:'tai',l:['Total annual income','СГД'],v:500000000},{k:'rd',l:['Reductions of TAI','Уменьшение СГД'],v:0},{k:'d',l:['Deductions','Вычеты'],v:380000000},{k:'r337',l:['Reduction Art. 337','Уменьшение ст. 337'],v:0},{k:'loss',l:['Losses carried forward','Перенесённые убытки'],v:20000000},{k:'r',l:['Rate','Ставка'],t:'s',v:'0.20',o:[['0.20',['20% general','20% общая']],['0.25',['25% banks / gambling','25% банки / игорный']],['0.03',['3% agri','3% с/х']],['0.06',['6% agri coops','6% с/х кооперативы']],['0.05',['5% social sphere','5% соцсфера']]]},{k:'ftc',l:['Foreign credit + withheld','Зачёт ин. налога + у источника'],v:0},{k:'adv',l:['Advances paid','Уплаченные авансы'],v:15000000}],
  run(v){const ti=v.tai-v.rd-v.d, tic=Math.max(0,ti-v.r337-v.loss), cit=Math.max(0,tic*(+v.r)-v.ftc);
   return {rows:[[['Taxable income','Налогооблагаемый доход'],ti,'t',[ti<0?'loss → carry forward':'',ti<0?'убыток → перенос':'']],[['For calculation (− losses)','Для исчисления (− убытки)'],tic,'t'],[['CIT','КПН'],cit,'t',null,1],[['To pay by 10 April','К уплате до 10 апреля'],cit-v.adv,'t'],[['Advance payments obligatory?','Авансы обязательны?'],v.tai>600000*META.MRP?(L==='en'?'Yes':'Да'):(L==='en'?'No':'Нет'),'s',['if TAI > 600,000 MRP','если СГД > 600 000 МРП']]]};}},
 penalty:{icon:'⏱',code:'W15',title:['Penalty for late payment','Пеня за просрочку'],arts:['Art. 5','Ст. 5'],
  inputs:[{k:'a',l:['Unpaid tax','Недоимка'],v:1000000},{k:'due',l:['Deadline','Срок уплаты'],t:'d',v:'2026-04-10'},{k:'pd',l:['Paid on','Дата уплаты'],t:'d',v:'2026-05-10'},{k:'m',l:['Multiplier','Коэффициент'],t:'s',v:'1.25',o:[['1.25',['1.25 general','1,25 общий']],['0.65',['0.65 horizontal monitoring','0,65 гориз. мониторинг']]]},{k:'nb',l:['NB base rate, %','Базовая ставка НБ, %'],v:null}],
  run(v){const nb=(v.nb==null?META.NB*100:v.nb)/100; const d=Math.max(0,Math.round((new Date(v.pd)-new Date(v.due))/864e5)); const pen=v.a*(+v.m)*nb/365*d;
   return {rows:[[['Days of delay','Дней просрочки'],d,'i'],[['PENALTY','ПЕНЯ'],pen,'t2',[`arrears × ${v.m} × ${(nb*100).toFixed(2)}% ÷ 365 × days`,`недоимка × ${v.m} × ${(nb*100).toFixed(2)}% ÷ 365 × дни`],1]]};}},
 propsale:{icon:'🏠',code:'W3',title:['IIT on selling property','ИПН при продаже имущества'],arts:['Art. 383, 384, 363','Ст. 383, 384, 363'],
  inputs:[{k:'t',l:['Property','Имущество'],t:'s',v:'h',o:[['h',['Housing','Жильё']],['v',['Vehicle','Транспорт']]]},{k:'s',l:['Sale price','Цена продажи'],v:30000000},{k:'b',l:['Purchase price','Цена покупки'],v:25000000},{k:'m',l:['Months owned','Месяцев владения'],v:18}],
  run(v){const tx=(v.t==='h'&&v.m<24)||(v.t==='v'&&v.m<12); return {rows:[[['Taxable?','Облагается?'],tx?(L==='en'?'Yes':'Да'):(L==='en'?'No — exempt':'Нет'),'s',['housing < 2 y · vehicle < 1 y','жильё < 2 лет · транспорт < 1 года']],[['IIT 10% (declare by 15 Sep)','ИПН 10% (декларация до 15 сент.)'],tx?Math.max(0,v.s-v.b)*.1:0,'t',null,1]]};}}
};
const CSTATE = {};
function pCalcList(){
  setTitle(T('calcFull'), L==='en'?'10 live calculators':'10 калькуляторов');
  view.innerHTML = `<div class="cgrid">${Object.entries(CALCS).map(([id,c])=>`<a class="ccard" href="#/c/${id}"><span class="ib">${I(CICON[id])}</span><b>${esc(tr(c.title))}</b><i>${esc(tr(c.arts))}</i></a>`).join('')}</div>
  <div class="foot">${esc(L==='en'?`MRP ${nf().format(META.MRP)} ₸ · MZP ${nf().format(META.MZP)} ₸ — change on the Rates tab`:`МРП ${nf().format(META.MRP)} ₸ · МЗП ${nf().format(META.MZP)} ₸ — изменить на вкладке «Ставки»`)}</div>`;
}
function donut(d){
  const tot = d.reduce((s,x)=>s+Math.max(0,x[1]),0)||1; let a=-Math.PI/2; const R=48, r=34, cx=56, cy=56;
  const segs = d.map(x=>{ const f=Math.max(0,x[1])/tot; const a2=a+f*2*Math.PI; const large = f>.5?1:0;
    const p = f>=0.9999? `<circle cx="${cx}" cy="${cy}" r="${(R+r)/2}" fill="none" stroke="${x[2]}" stroke-width="${R-r}"/>` :
      `<path d="M${cx+R*Math.cos(a)},${cy+R*Math.sin(a)} A${R},${R} 0 ${large} 1 ${cx+R*Math.cos(a2)},${cy+R*Math.sin(a2)} L${cx+r*Math.cos(a2)},${cy+r*Math.sin(a2)} A${r},${r} 0 ${large} 0 ${cx+r*Math.cos(a)},${cy+r*Math.sin(a)} Z" fill="${x[2]}" stroke="#131315" stroke-width="1.5"/>`;
    a=a2; return p; }).join('');
  return `<div class="donut"><svg width="112" height="112" viewBox="0 0 112 112" aria-hidden="true">${segs}</svg><div class="legend">${d.map(x=>`<div><i style="background:${x[2]}"></i>${esc(tr(x[0]))} · <b class="tn">${fmtP(Math.max(0,x[1])/tot)}</b></div>`).join('')}</div></div>`;
}
function pCalc(id){
  const c = CALCS[id]; if(!c){ location.hash='#/c'; return; }
  setTitle(tr(c.title), T('calcFull'));
  const st = CSTATE[id] || (CSTATE[id] = Object.fromEntries(c.inputs.map(i=>[i.k, i.v])));
  view.innerHTML = `<div class="phero"><div class="big" style="top:-4px;right:8px;color:rgba(201,169,110,.14)">${I(CICON[id]).replace('class="i"','class="i" style="width:96px;height:96px;stroke-width:1"')}</div>
    <div class="eyebrow" style="position:relative">${esc(tr(c.arts))}</div><h1>${esc(tr(c.title))}</h1></div>
  ${sec(T('inputs'))}
  <div class="card pad" id="ci">${c.inputs.map(i=>`<div class="inp"><label for="i_${i.k}">${esc(tr(i.l))}</label>${
    i.t==='s'? `<select id="i_${i.k}" data-k="${i.k}">${i.o.map(o=>`<option value="${o[0]}" ${String(st[i.k])===o[0]?'selected':''}>${esc(tr(o[1]))}</option>`).join('')}</select>` :
    i.t==='d'? `<input id="i_${i.k}" data-k="${i.k}" type="date" value="${st[i.k]}">` :
    `<input id="i_${i.k}" data-k="${i.k}" type="number" inputmode="decimal" step="any" value="${st[i.k]==null?(i.k==='nb'?(META.NB*100).toFixed(2):''):st[i.k]}">`}</div>`).join('')}
    ${c.even?`<button class="fill" id="even">${I('fill')}${esc(T('fillEven'))}</button>`:''}</div>
  ${sec(T('result'))}
  <div class="card pad" id="co"></div>`;
  const calc = ()=>{
    const v = {}; c.inputs.forEach(i=>{ const x = st[i.k]; v[i.k] = (i.t==='s'||i.t==='d')? x : (x===''||x==null? (i.k==='nb'? null : 0) : +x); });
    const r = c.run(v);
    document.getElementById('co').innerHTML = r.rows.map(([l,val,f,n,big])=>{
      const s = f==='t'? fmtT(val) : f==='t2'? fmtT(val,true) : f==='p'? fmtP(val) : f==='i'? nf().format(val) : esc(val);
      const note = n? tr(n) : '';
      return `<div class="res ${big?'big':''}"><div>${esc(tr(l))}${note?`<small>${esc(note)}</small>`:''}</div><div class="v">${s}</div></div>`;}).join('')
      + (r.charts? r.charts.map(ch=>`<div style="padding:14px 0 6px;border-top:1px solid var(--line)"><b style="font-size:13.5px;font-weight:600">${esc(tr(ch.t))}</b>${donut(ch.d)}</div>`).join('') : '');
  };
  document.getElementById('ci').addEventListener('input', e=>{ const k=e.target.dataset.k; if(!k) return; st[k] = e.target.value; calc(); });
  document.getElementById('ci').addEventListener('change', e=>{ const k=e.target.dataset.k; if(!k) return; st[k] = e.target.value; haptic(); calc(); });
  const ev = document.getElementById('even'); if(ev) ev.addEventListener('click', ()=>{ const a=+st.b0||0, b=+st.b12||0; for(let i=1;i<12;i++){ st['b'+i]=Math.round(a+(b-a)*i/12); const el=document.getElementById('i_b'+i); if(el) el.value=st['b'+i]; } haptic(); calc(); });
  calc();
}
// ---------- calendar ----------
let calMonth = new Date().getMonth()+1;
function pCal(){
  setTitle(T('cal'), T('calSub'));
  const cur = new Date().getMonth()+1;
  const head = MSHORT[L].map((m,i)=>`<th class="${i+1===cur?'cur':''}">${m}</th>`).join('');
  const rows = D.calendar.map(r=>`<tr><td class="nm">${esc(tr(r.name))}</td>${Array.from({length:12},(_,i)=>{ const ev=r.ev[String(i+1)]; if(!ev) return '<td></td>';
      const pay = ev.some(e=>e[1]==='P'); return `<td class="${pay?'P':'D'}">${ev.map(e=>KIND[e[1]][L==='en'?0:1]+e[0]).join('<br>')}</td>`;}).join('')}</tr>`).join('');
  view.innerHTML = `<div class="mchips" id="mc">${MSHORT[L].map((m,i)=>`<button class="chip ${i+1===calMonth?'on':''}" data-m="${i+1}">${m}</button>`).join('')}</div>
    <div class="sec" style="margin-top:6px"><h2 id="mtitle">${esc(MONTHS[L][calMonth-1])}</h2></div>
    <div id="mcard">${monthCard(calMonth)}</div>
    ${sec(T('year'))}<div class="count2" style="letter-spacing:.04em;text-transform:none">${esc(T('calHint'))} · ${esc(T('legend'))}</div>
    <div class="hscroll"><table class="hm"><thead><tr><th style="text-align:left;padding-left:10px">${esc(T('tax'))}</th>${head}</tr></thead><tbody>${rows}</tbody></table></div>
    <div class="foot">${esc(T('nonwork'))} <a href="#/d" style="color:var(--gold);font-weight:600">${esc(T('dl'))} →</a></div>`;
  try{ const on=document.querySelector('#mc .chip.on'); if(on) on.scrollIntoView({inline:'center',block:'nearest'}); }catch(e){}
  document.getElementById('mc').addEventListener('click', e=>{ const b=e.target.closest('[data-m]'); if(!b) return; calMonth=+b.dataset.m; haptic();
    document.querySelectorAll('#mc .chip').forEach(x=>x.classList.toggle('on', x===b));
    document.getElementById('mtitle').textContent = MONTHS[L][calMonth-1];
    document.getElementById('mcard').innerHTML = monthCard(calMonth); });
}
// ---------- rates ----------
function pRates(){
  setTitle(T('rates'), '2026');
  let html = `<div class="card" style="padding:16px"><div class="eyebrow" style="font-size:10.5px">${esc(T('settings'))}</div><div class="settings">
    <div><label for="sMRP">${L==='en'?'MRP, ₸':'МРП, ₸'}</label><input id="sMRP" type="number" value="${META.MRP}"></div>
    <div><label for="sMZP">${L==='en'?'MZP, ₸':'МЗП, ₸'}</label><input id="sMZP" type="number" value="${META.MZP}"></div>
    <div><label for="sNB">${L==='en'?'NB rate, %':'Ставка НБ, %'}</label><input id="sNB" type="number" step="0.01" value="${(META.NB*100).toFixed(2)}"></div></div>
    <button class="fill" id="sreset">${I('reset')}${esc(T('reset'))}</button></div>`;
  let open = false;
  D.rates.forEach(r=>{
    if(r.band){ if(open) html+='</div>'; html += `<div class="bandh">${ti(r.band)}${esc(tr(r.t))}</div><div class="card pad">`; open=true; return; }
    let val='', tg_='', bar=''; const v = r.val;
    if(v.k==='mrpval'){ val = fmtT(META.MRP); } else if(v.k==='mzpval'){ val = fmtT(META.MZP); }
    else if(v.k==='pct'){ val = fmtP(v.v); bar = `<div class="bar"><i style="width:${Math.min(100,v.v*300)}%"></i></div>`; }
    else if(v.k==='mrp'){ val = nf().format(v.v)+' '+(L==='en'?'MRP':'МРП'); tg_ = `<span class="tg">= ${fmtT(v.v*META.MRP)}</span>`; }
    else if(v.k==='tenge'){ val = v.v.toLocaleString(loc())+' '+tr(v.u); }
    else { val = esc(tr(v.t)); }
    const n = tr(r.n);
    html += `<div class="rrow" ${r.art?`data-art="${r.art}"`:''}><div class="top2"><div class="l">${esc(tr(r.l))}</div><div class="val">${val}${tg_}</div></div>
      ${(n||r.art)?`<div class="n">${esc(n)}${r.art?`${n?' · ':''}<b>${T('art')} ${r.art}</b>`:''}</div>`:''}${bar}</div>`;
  });
  if(open) html += '</div>';
  view.innerHTML = html;
  const upd = ()=>{ META.MRP = +document.getElementById('sMRP').value || D.meta.MRP; META.MZP = +document.getElementById('sMZP').value || D.meta.MZP; META.NB = (+document.getElementById('sNB').value || D.meta.NB*100)/100;
    store.set('meta', {MRP:META.MRP, MZP:META.MZP, NB:META.NB}); };
  ['sMRP','sMZP','sNB'].forEach(id=>document.getElementById(id).addEventListener('change', ()=>{ upd(); pRates(); }));
  document.getElementById('sreset').addEventListener('click', ()=>{ Object.assign(META, D.meta); store.set('meta', {}); haptic(); pRates(); });
}
// ---------- deadlines ----------
function pDl(){
  setTitle(T('dl'), L==='en'?'Periods · returns · payments':'Периоды · декларации · уплата');
  view.innerHTML = `<div class="card pad">${D.deadlines.map(x=>`<div class="dl"><div class="h">${ti(x.code)}<span>${esc(tr(x.tax))}</span><span class="per">${esc(tr(x.per))}</span></div>
    <div class="r2"><b>${esc(T('ret'))}</b><div>${esc(tr(x.ret))}${x.ar?` <span class="ref" data-art="${x.ar}">${T('art')} ${x.ar}</span>`:''}</div>
    <b>${esc(T('pay'))}</b><div class="py">${esc(tr(x.pay))}${x.ap?` <span class="ref" data-art="${x.ap}">${T('art')} ${x.ap}</span>`:''}</div></div></div>`).join('')}</div>
    ${sec(T('keydates'))}<div class="card pad">${D.keydates.map(k=>`<div class="kd"><div class="d">${esc(tr(k.d))}</div><div>${esc(tr(k.what))}</div></div>`).join('')}</div>`;
}
// ---------- glossary ----------
function pGl(){
  setTitle(T('gl'), `${D.glossary.length} ${L==='en'?'terms':'терминов'}`);
  view.innerHTML = `<div class="search"><label>${I('search')}<input id="gq" type="search" placeholder="${esc(T('filter'))}" aria-label="${esc(T('filter'))}"></label></div><div class="card pad" id="gll"></div>`;
  const draw = (q)=>{ const nq=norm(q); document.getElementById('gll').innerHTML = D.glossary.filter(g=>!nq || norm(g.term.en+' '+g.term.ru+' '+g.mean.en+' '+g.mean.ru).includes(nq))
    .map(g=>`<div class="gl" ${g.art?`data-art="${g.art}"`:''}><b>${esc(tr(g.term))}</b> ${g.art?`<span class="ref">${T('art')} ${g.art} · ${T('pg')} ${P(g.art)}</span>`:''}<div>${esc(tr(g.mean))}</div></div>`).join('') || `<div class="empty">${esc(T('noRes'))}</div>`; };
  document.getElementById('gq').addEventListener('input', e=>draw(e.target.value)); draw('');
}
// ---------- code map ----------
function pMap(){
  setTitle(T('map'), T('mapSub'));
  view.innerHTML = D.codemap.map(s=>`<details class="sct"><summary><span class="sn">${s.sec? (L==='en'?'Sec. ':'Разд. ')+s.sec : '—'}</span><span>${esc(tr(s.name))}</span></summary>
    ${s.ch.map(c=>`<div class="chr" data-art="${c.a1}"><span class="cn">${c.n? (L==='en'?'Ch. ':'Гл. ')+c.n : '—'}</span><span class="x">${c.w?ti(c.w):''}<span>${esc(tr(c.name))}</span></span><span class="ar2 tn">${c.a1}${c.a2>c.a1?'–'+c.a2:''} · ${T('pg')} ${L==='en'?c.pen:c.pru}</span></div>`).join('')}</details>`).join('');
}
// ---------- router ----------
function route(){ return (location.hash||'').replace(/^#\/?/,''); }
function render(){
  const r = route(); shell(r);
  document.getElementById('ov').innerHTML='';
  if(r==='' ) pHome();
  else if(r.startsWith('t/')) pTopic(r.slice(2));
  else if(r==='s') pSearch();
  else if(r==='c') pCalcList();
  else if(r.startsWith('c/')) pCalc(r.slice(2));
  else if(r==='cal') pCal();
  else if(r==='r') pRates();
  else if(r==='d') pDl();
  else if(r==='g') pGl();
  else if(r==='m') pMap();
  else pHome();
}
window.addEventListener('hashchange', ()=>{ haptic(); render(); window.scrollTo(0,0); });
if(window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData) initTG();
render();
})();
